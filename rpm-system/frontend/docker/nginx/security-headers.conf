# Security headers, included in http{} AND in every location that sets its own add_header.
# nginx does not inherit add_header into a location that defines any add_header of its own, which
# is why the headers set once at http level never reached the pages. Keep this list in one place.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()" always;
